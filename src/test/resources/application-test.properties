# "test" profile: layered on top of src/main/resources/application.properties. Enable with @ActiveProfiles("test").

# Separate in-memory DB for tests so they never share state with a running server
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=false
spring.jpa.show-sql=true

spring.application.name=challenge

# --- Server ---
server.port=8080
# Finish in-flight requests before shutting down
server.shutdown=graceful

# --- In-memory database (H2) ---
# Data lives only while the app runs; it is wiped on every restart.
spring.datasource.url=jdbc:h2:mem:challengedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# Create the schema from the @Entity classes on startup, drop it on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
# Keep DB access inside the service layer, not during JSON rendering
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- H2 web console (dev convenience): http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Errors: RFC 9457 "problem+json" responses ---
spring.mvc.problemdetails.enabled=true

# --- Actuator: expose only health and info ---
management.endpoints.web.exposure.include=health,info

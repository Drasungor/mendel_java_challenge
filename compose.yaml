services:
  # REST API server
  #   docker compose up --build
  app:
    build:
      context: .
      target: runtime
    image: mendel-challenge:latest
    container_name: mendel-challenge
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Give Spring's graceful shutdown time to finish in-flight requests
    stop_grace_period: 30s

  # Test suite: only started on demand
  #   docker compose run --rm test
  test:
    build:
      context: .
      target: test
    image: mendel-challenge-test:latest
    profiles: ["test"]
